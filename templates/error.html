{% extends "base.html" %}

{% block title %}
Error | ZENVEX
{% endblock %}

{% block content %}

<div class="error-page">

    <div class="error-card">

        <div class="error-icon">
            !
        </div>

        <span class="error-label">
            REQUEST ERROR
        </span>

        <h1>
            Something went wrong
        </h1>

        <p>
            {{ message or "The request could not be processed. Please try again." }}
        </p>

        <a href="/" class="error-button">
            ← Back to ZENVEX
        </a>

    </div>

</div>

{% endblock %}
